# Development backing and authentication services only. FastAPI and Vite run natively.
services:
  db:
    image: postgres:12
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      retries: 30
      timeout: 3s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"

  adminer:
    image: adminer
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DESIGN: pepa-linha-dark
    ports:
      - "${ADMINER_PORT:-8080}:8080"

  dex:
    image: dexidp/dex:latest-distroless
    restart: "no"
    environment:
      DEX_PORT: ${DEX_PORT:-5556}
      OAUTH2_PROXY_PORT: ${OAUTH2_PROXY_PORT:-4180}
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      DEX_TEST_USER_EMAIL: ${DEX_TEST_USER_EMAIL}
      DEX_TEST_USER_USERNAME: ${DEX_TEST_USER_USERNAME}
      DEX_TEST_USER_ID: ${DEX_TEST_USER_ID}
      DEX_TEST_USER_PASSWORD_HASH: ${DEX_TEST_USER_PASSWORD_HASH}
    ports:
      - "${DEX_PORT:-5556}:5556"
    volumes:
      - ./dev/dex/config.yaml:/etc/dex/config.docker.yaml:ro

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3@sha256:10a1165743a192e1940b4708fb9647027185ce11a681a1c5519b442ff7f1f561
    restart: "no"
    command:
      - --http-address=0.0.0.0:4180
      - --provider=oidc
      - --client-id=${OAUTH2_PROXY_CLIENT_ID}
      - --client-secret=${OAUTH2_PROXY_CLIENT_SECRET}
      - --oidc-issuer-url=http://localhost:${DEX_PORT:-5556}/dex
      - --skip-oidc-discovery
      - --login-url=http://localhost:${DEX_PORT:-5556}/dex/auth
      - --redeem-url=http://dex:5556/dex/token
      - --oidc-jwks-url=http://dex:5556/dex/keys
      - --redirect-url=http://localhost:${OAUTH2_PROXY_PORT:-4180}/oauth2/callback
      - --upstream=http://${DEV_PROXY_UPSTREAM_HOST:-host.docker.internal}:${WEB_PORT:-5173}
      - --email-domain=*
      - --cookie-name=_oauth2_proxy
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET}
      - --cookie-secure=${OAUTH2_PROXY_COOKIE_SECURE:-false}
      - --cookie-httponly=true
      - --cookie-samesite=lax
      - --basic-auth-password=${OAUTH2_PROXY_UPSTREAM_PASSWORD}
      - --pass-basic-auth=true
      - --pass-user-headers=true
      - --pass-authorization-header=false
      - --set-authorization-header=false
      - --insecure-oidc-skip-nonce=false
      - --code-challenge-method=S256
      - --skip-provider-button=true
      - --approval-prompt=auto
    depends_on:
      - dex
    extra_hosts:
      - "${DEV_PROXY_EXTRA_HOST_MAPPING:-dev-proxy-noop.invalid:127.0.0.1}"
    ports:
      - "${OAUTH2_PROXY_PORT:-4180}:4180"

volumes:
  app-db-data:
