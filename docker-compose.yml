# Development backing services only. The API runs natively via `npm run dev`.
services:
  db:
    image: postgres:12
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      retries: 30
      timeout: 3s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"

  adminer:
    image: adminer
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    ports:
      - "${ADMINER_PORT:-8080}:8080"

volumes:
  app-db-data:
